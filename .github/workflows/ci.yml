name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # actions 运行时基线：checkout / setup-node / action-setup v6 均为 node24。
      # v4 声明 node20，已被 GitHub 强制跑在 node24 并产生弃用告警（不失败，但噪音）；
      # v6 是当前 node24 的稳定 patched 大版本（checkout v6.1.0 / setup-node v6.5.0 /
      # action-setup v6.1.0）。三者对我们的用法（无输入、显式 cache: pnpm）行为一致：
      #   - setup-node v5+ 新增 packageManager 自动缓存，但显式 cache 分支优先（src/main.ts），
      #     我们是显式 cache: pnpm，不受影响；
      #   - action-setup v6 支持 pnpm v12 及更早，省略 version 时读取 packageManager
      #     （本项目锁定 pnpm@10.33.0），与 v4 行为一致。
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # link: 依赖不会替被链接的包安装依赖，这里显式安装插件自己的 schemastery。
      - run: pnpm install --frozen-lockfile
      - run: npm test
